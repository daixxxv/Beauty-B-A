services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: Beauty_BA_development
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    command: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis:/var/lib/redis

  chrome:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      bash -c "
        bundle install &&
        bundle exec rails db:prepare &&
        rm -f tmp/pids/server.pid &&
        yarn install &&
        ./bin/dev
      "
    tty: true
    stdin_open: true
    ports:
      - "3000:3000"
    environment:
      - SELENIUM_DRIVER_URL=http://chrome:4444/wd/hub
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle:cached
      - node_modules:/app/node_modules
    depends_on:
      - db
      - redis
      - chrome

volumes:
  postgres_data:
  bundle_data:
  node_modules:
  redis: